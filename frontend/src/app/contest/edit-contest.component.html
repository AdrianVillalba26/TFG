<div class="body">
    <div class="header">
        <app-menu (backClicked)="goBack()"></app-menu>
    </div>

    <div class="container">
        <h2 class="title">Editar {{contest.contestName}}</h2>

        <div class="form-group">
            <label for="contestName">Nombre del concurso</label>
            <input type="text" id="contestName" [(ngModel)]="contestName" />
        </div>

        <div class="form-group">
            <label for="numTries">Número de intentos</label>
            <select id="numTries" [(ngModel)]="numTries">
                <option *ngFor="let try of [2,3,4,5,6]" [value]="try">{{ try }}</option>
            </select>
        </div>

        <div class="form-group">
            <label for="startDateTime">Fecha y hora de inicio</label>
            <input type="datetime-local" id="startDateTime" [(ngModel)]="formattedStartDate" class="date-input" />
        </div>

        <div class="form-group">
            <label for="endDateTime">Fecha y hora de fin</label>
            <input type="datetime-local" id="endDateTime" [(ngModel)]="formattedEndDate" class="date-input" />
        </div>

        <div class="checkbox-group">
            <p>¿Desea utilizar diccionario?</p>
            <label>
                <input type="radio" name="useDictionaryGroup" (change)="useDictionary(true)" [checked]="dictionary" />
                Sí
            </label>
            <label>
                <input type="radio" name="useDictionaryGroup" (change)="useDictionary(false)"
                    [checked]="!dictionary" />
                No
            </label>
        </div>

        <div *ngIf="dictionary" class="form-group">
            <p>Adjuntar fichero de diccionario (.txt)</p>

            <p *ngIf="file" class="file-status-text" style="color: green; font-size: 0.9em;">
                ✓ Ya hay un fichero de diccionario guardado para este concurso. (Puedes subir uno nuevo si deseas reemplazarlo).
            </p>
            
            <input type="file" accept=".txt" (change)="selectFile($event)" />
        </div>


        <div class="btn-container">
            <button class="btn-primary" (click)="updateContest()">Guardar Concurso</button>
        </div>
    </div>

    <app-footer></app-footer>
</div>
