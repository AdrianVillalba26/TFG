<div class="container">
    <div class="students-table-container">
        <table class="students-table">
            <thead>
                <tr>
                    <th>Nombre del alumno</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let student of students">
                    <td class="student-cell">{{ student.username }}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn primary" (click)="openStudentModal()">
        <span class="fa fa-plus"></span>
        <span class="button-text">Añadir Alumno</span>
    </button>
</div>

<div class="modal-backdrop" *ngIf="showModal" (click)="closeModalOnBackdropClick($event)">
    <div class="modal">
        <app-new-student [competitionId]="competitionId" [professorName]="professorName">
        </app-new-student>
    </div>
</div>
