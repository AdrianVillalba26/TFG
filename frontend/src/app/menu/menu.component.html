<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
  rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div class="header">
  <img src="../../assets/sin_fondo_negro_zoom.png" alt="Logo Universidad" class="logo">

  <button class="hamburger-btn" *ngIf="isLogged" (click)="toggleMenu()" aria-label="Menú">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <ng-container *ngIf="isLogged">

    <div class="nav-links" [class.open]="isMenuOpen">

      <button *ngIf="!isAdmin" class="nav-button" routerLink="/competiciones" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}" (click)="isMenuOpen = false">
        Página Principal
      </button>

      <button class="nav-button" routerLink="/wordles" routerLinkActive="active"
        *ngIf="isProfessor && !isPlayingWordle" (click)="isMenuOpen = false">
        Ver Wordles
      </button>

      <button class="nav-button" routerLink="/wordlesResueltos" routerLinkActive="active"
        *ngIf="isStudent && !isPlayingWordle" (click)="isMenuOpen = false">
        Ver Wordles
      </button>

      <button class="nav-button" routerLink="/usuarios" routerLinkActive="active" *ngIf="isAdmin" (click)="isMenuOpen = false">
        Ver Usuarios
      </button>

      <div class="spacer"></div>

      <button class="nav-button logout-btn" (click)="onLogOut(); isMenuOpen = false">Cerrar Sesión</button>

    </div>



  </ng-container>

</div>
